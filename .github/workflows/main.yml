name: Build Flipper FAP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build FAP with uFBT
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-app
        with:
          # Change this to match your app's folder name / APPID
          app-dir: static_ble_advertiser
          # Options: 'release' (stable) or 'dev' (bleeding edge)
          channel: release

      - name: Upload FAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-ble-advertiser-fap
          path: ${{ steps.build-app.outputs.fap-path }}
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build-app.outputs.fap-path }}
